services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env.worker
    volumes: ["worker_state:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  worker_state:
    external: true
    # Matches the standard volume created by the former worker-legacy Compose
    # project so an existing registration.json survives the monorepo switch.
    name: worker_worker_state
